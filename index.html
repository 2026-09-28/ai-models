<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Models</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        li {
            list-style-type: none;
        }

        body {
            min-height: 100dvh;
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif
        }

        .container {
            background-color: white;
            padding: 1rem;
            max-width: 450px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-radius: 32px;

            .buttons-container {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem
            }

            button {
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 12px;
                cursor: pointer;

                &:hover {
                    background-color: rgb(255, 242, 201);
                }

                &:active {
                    scale: 0.95;
                }
            }

            .models-list {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;

                a:hover {
                    color: rgb(224, 123, 0);
                }

                a:active {
                    color: red;
                }
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 AI Models</h1>
        <div class="buttons-container">
            <button data-provider="openai">OpenAI</button>
            <button data-provider="anthropic">Anthropic</button>
            <button data-provider="google">Google</button>
            <button data-provider="meta">Meta</button>
        </div>
        <ul class="models-list"></ul>
    </div>

    <script>
        const buttonsContainer = document.querySelector('.buttons-container')
        const modelsList = document.querySelector('.models-list')

        buttonsContainer.addEventListener('click', e => {
            if (e.target === e.currentTarget) {
                return;
            }

            modelsList.textContent = ''

            const provider = e.target.dataset.provider

            const xhr = new XMLHttpRequest()

            xhr.open('GET', `./providers/${provider}.json`)

            xhr.onload = () => {
                const response = JSON.parse(xhr.response)
                const { models, url } = response

                for (const model of models) {
                    const li = document.createElement('li')
                    const a = document.createElement('a')

                    a.href = url + model.id
                    a.textContent = model.name
                    a.target = "_blank"
                    a.title = model.id

                    li.append(a)
                    modelsList.append(li)
                }
            }
            xhr.send()
        })
    </script>
</body>

</html>
